# 依赖更新自动化——上游依赖的安全与版本更新不依赖上游合并，由 dependabot 兜底
# 策略见 README「与上游 Keep 的关系」：季度审阅上游变更、按需 cherry-pick；依赖走自动化
version: 2
updates:
  # Python 依赖（poetry）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # 前端（pnpm）
  - package-ecosystem: npm
    directory: "/keep-ui"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # 文档站（pnpm）
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
