name: keep-local

services:
  keep-backend:
    build:
      context: ../../
      dockerfile: deploy/local/Dockerfile.api
    ports:
      - "4080:8080"
    environment:
      - PORT=8080
      - AUTH_TYPE=NO_AUTH
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/state
      - DATABASE_CONNECTION_STRING=sqlite:////state/db.sqlite3?check_same_thread=False
      - PUSHER_APP_ID=1
      - PUSHER_APP_KEY=keepappkey
      - PUSHER_APP_SECRET=keepappsecret
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - USE_NGROK=false
    volumes:
      - ./state:/state

  keep-frontend:
    build:
      context: ../../keep-ui
      dockerfile: ../deploy/local/Dockerfile.ui
      args:
        - API_URL=http://keep-backend:8080
    ports:
      - "4000:3000"
    environment:
      - AUTH_TYPE=NO_AUTH
      - NEXTAUTH_SECRET=secret
      - NEXTAUTH_URL=http://localhost:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4080
      - API_URL=http://keep-backend:8080
      - PUSHER_HOST=localhost
      - PUSHER_PORT=6001
      - PUSHER_APP_KEY=keepappkey
      - POSTHOG_KEY=
      - POSTHOG_HOST=
      - SENTRY_DISABLED=true
    depends_on:
      - keep-backend

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    ports:
      - "6001:6001"
    environment:
      - SOKETI_USER_AUTHENTICATION_TIMEOUT=3000
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=keepappkey
      - SOKETI_DEFAULT_APP_SECRET=keepappsecret

volumes:
  backend-state:
