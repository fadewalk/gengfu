global:
  scrape_interval: 15s
  evaluation_interval: 10s
  external_labels:
    cluster: 'idc-mock'
    env: 'production'
    datacenter: 'idc'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/alert.rules"

scrape_configs:
  # Node Exporter - 主机指标
  - job_name: 'node'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'idc-server-01'
          os: 'linux'
          role: 'server'
          env: 'production'

  # Keep 后端
  - job_name: 'keep'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['keep-backend:8080']
        labels:
          instance: 'keep-backend'
          service: 'keep-api'
          env: 'production'

  # Prometheus 自身
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'
          service: 'monitoring'
          env: 'production'
