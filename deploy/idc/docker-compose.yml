# ============================================================
# Keep IDC 离线部署 docker-compose
# 适用于无法访问外网的 IDC 机房环境
# 所有遥测、AI、外部 CDN 均已禁用
# ============================================================

services:
  keep-frontend:
    build:
      context: ../../keep-ui
      dockerfile: ../deploy/idc/Dockerfile.ui
    container_name: keep-frontend
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-NO_AUTH}
      - API_URL=http://keep-backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:4000}
      # 禁用遥测
      - POSTHOG_DISABLED=true
      - NEXT_TELEMETRY_DISABLED=1
      # WebSocket
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - PUSHER_APP_KEY=keepappkey
    volumes:
      - keep-state:/state
    depends_on:
      keep-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - keep-network

  keep-backend:
    build:
      context: ../..
      dockerfile: deploy/idc/Dockerfile.api
    container_name: keep-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-NO_AUTH}
      - PORT=8080
      - SECRET_MANAGER_TYPE=${SECRET_MANAGER_TYPE:-FILE}
      - SECRET_MANAGER_DIRECTORY=/state
      # 直接使用 SQLite，不读取 .env 中的 MySQL 配置
      # 如需使用 MySQL，取消注释下方行并注释 SQLite 行
      - DATABASE_CONNECTION_STRING=sqlite:////state/db.sqlite3?check_same_thread=False
      # - DATABASE_CONNECTION_STRING=mysql+pymysql://${DB_USER:-keep}:${DB_PASSWORD:-keep_idc_password}@mysql:3306/${DB_NAME:-keep}
      # 禁用遥测
      - POSTHOG_DISABLED=true
      - KEEP_METRICS=false
      # WebSocket
      - PUSHER_APP_ID=${PUSHER_APP_ID:-1}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-keepappkey}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-keepappsecret}
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - USE_NGROK=false
      - KEEP_API_URL=http://localhost:8080
      - KEEP_JWT_SECRET=${KEEP_JWT_SECRET:-keep-idc-jwt-secret-2026}
    volumes:
      - keep-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthcheck')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - keep-network

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    container_name: keep-websocket-server
    ports:
      - "${WEBSOCKET_PORT:-6001}:6001"
    environment:
      - SOKETI_USER_AUTHENTICATION_TIMEOUT=3000
      - SOKETI_DEBUG=0
      - SOKETI_DEFAULT_APP_ID=${PUSHER_APP_ID:-1}
      - SOKETI_DEFAULT_APP_KEY=${PUSHER_APP_KEY:-keepappkey}
      - SOKETI_DEFAULT_APP_SECRET=${PUSHER_APP_SECRET:-keepappsecret}
    restart: unless-stopped
    networks:
      - keep-network

  # 可选：MySQL 数据库
  # 取消注释使用 MySQL 替代 SQLite
  # mysql:
  #   image: mysql:8.0
  #   container_name: keep-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-keep_idc_password}
  #     MYSQL_DATABASE: ${DB_NAME:-keep}
  #     MYSQL_USER: ${DB_USER:-keep}
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-keep_idc_password}
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   restart: unless-stopped
  #   networks:
  #     - keep-network

  # 可选：Redis (Celery)
  # redis:
  #   image: redis:7-alpine
  #   container_name: keep-redis
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   restart: unless-stopped
  #   networks:
  #     - keep-network

volumes:
  keep-state:
    driver: local

networks:
  keep-network:
    driver: bridge
