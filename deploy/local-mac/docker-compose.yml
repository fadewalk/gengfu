services:
  keep-backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    extends:
      file: ../../docker-compose.common.yml
      service: keep-backend-common
    environment:
      - AUTH_TYPE=NO_AUTH
    volumes:
      - ../../state:/state

  keep-frontend:
    build:
      context: ../..
      dockerfile: deploy/local-mac/Dockerfile.ui
    extends:
      file: ../../docker-compose.common.yml
      service: keep-frontend-common
    environment:
      - AUTH_TYPE=NO_AUTH
      - API_URL=http://keep-backend:8080
      - SENTRY_DISABLED=true
    volumes:
      - ../../state:/state
    depends_on:
      - keep-backend

  keep-websocket-server:
    extends:
      file: ../../docker-compose.common.yml
      service: keep-websocket-server-common
