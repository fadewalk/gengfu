global:
  scrape_interval: 15s
  evaluation_interval: 10s
  external_labels:
    cluster: 'idc-mock'
    env: 'production'
    datacenter: 'idc'

remote_write:
  - url: http://192.168.1.23:18428/api/v1/write
    tls_config:
      insecure_skip_verify: true
    queue_config:
      capacity: 10000
      max_shards: 30
      min_shards: 1
      max_samples_per_send: 2000

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/alert.rules"

scrape_configs:
  # Node Exporter - 主机指标
  - job_name: 'node'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'idc-server-01'
          os: 'linux'
          role: 'server'
          env: 'production'

  # Keep 后端
  - job_name: 'keep'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['keep-backend:8080']
        labels:
          instance: 'keep-backend'
          service: 'keep-api'
          env: 'production'

  # Prometheus 自身
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'
          service: 'monitoring'
          env: 'production'

  # Federation: scrape VictoriaMetrics /metrics (self-monitoring)
  - job_name: 'victorialogs'
    scrape_interval: 15s
    static_configs:
      - targets: ['victorialogs:9428']
        labels:
          instance: 'victorialogs'
          service: 'victorialogs'
          env: 'production'

  - job_name: 'victoriametrics'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['victoriametrics:8428']
        labels:
          instance: 'victoriametrics'
          service: 'victoriametrics'
          env: 'production'
