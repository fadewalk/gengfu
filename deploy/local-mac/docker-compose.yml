services:
  keep-backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    extends:
      file: ../../docker-compose.common.yml
      service: keep-backend-common
    environment:
      - AUTH_TYPE=NO_AUTH
      - KEEP_ALLOW_MESH_ALERT_INGESTION=true
      - OPENAI_API_KEY=45f87d5d955a6e44fa94c5a5cacd96d1.nJZbr53s2hM0tSiJ
      - OPENAI_BASE_URL=https://open.bigmodel.cn/api/coding/paas/v4
      - OPENAI_MODEL_NAME=glm-5-turbo
    volumes:
      - ../../state:/state

  keep-frontend:
    build:
      context: ../..
      dockerfile: deploy/local-mac/Dockerfile.ui
      args:
        - OPENAI_API_KEY=45f87d5d955a6e44fa94c5a5cacd96d1.nJZbr53s2hM0tSiJ
    extends:
      file: ../../docker-compose.common.yml
      service: keep-frontend-common
    environment:
      - AUTH_TYPE=NO_AUTH
      - API_URL=http://keep-backend:8080
      - SENTRY_DISABLED=true
    volumes:
      - ../../state:/state
    depends_on:
      - keep-backend

  keep-websocket-server:
    extends:
      file: ../../docker-compose.common.yml
      service: keep-websocket-server-common

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: local-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ../../state/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../state/alert.rules:/etc/prometheus/alert.rules:ro
      - ../../state/prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: local-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../state/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
