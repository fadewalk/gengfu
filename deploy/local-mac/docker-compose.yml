include:
  - docker-compose.monitoring.yml

services:
  keep-backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    extends:
      file: ../../deploy/docker/docker-compose.common.yml
      service: keep-backend-common
    environment:
      - AUTH_TYPE=LDAP
      - KEEP_JWT_SECRET=keep-local-dev-secret-2026
      - KEEP_ALLOW_MESH_ALERT_INGESTION=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - LDAP_URL=ldap://openldap:389
      - LDAP_BIND_DN=cn=admin,dc=ubiq2,dc=com
      - LDAP_BIND_PASSWORD=rLhQq572Kq
      - LDAP_BASE_DN=dc=ubiq2,dc=com
      - LDAP_USER_SEARCH_BASE=ou=坤九,dc=ubiq2,dc=com
      - LDAP_DEFAULT_ROLE=Admin
    networks:
      - keep-shared
    volumes:
      - ../../state:/state

  keep-frontend:
    build:
      context: ../..
      dockerfile: deploy/local-mac/Dockerfile.ui
      args:
        - OPENAI_API_KEY=${OPENAI_API_KEY}
    extends:
      file: ../../deploy/docker/docker-compose.common.yml
      service: keep-frontend-common
    ports:
      - "4000:3000"
    environment:
      - AUTH_TYPE=DB
      - API_URL=http://keep-backend:8080
      - SENTRY_DISABLED=true
    volumes:
      - ../../state:/state
    depends_on:
      - keep-backend
    networks:
      - keep-shared

  keep-websocket-server:
    extends:
      file: ../../deploy/docker/docker-compose.common.yml
      service: keep-websocket-server-common
    networks:
      - keep-shared

networks:
  keep-shared:
    external: true
